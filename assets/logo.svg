<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
<defs>
 <linearGradient id="violet" x1="0" y1="0" x2="856" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#25203F"/><stop offset=".42" stop-color="#17152C"/><stop offset="1" stop-color="#090C1A"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="460" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#5964C9"/><stop offset="1" stop-color="#31C5D8"/></linearGradient>
 <clipPath id="clip"><rect x="8" y="8" width="840" height="524" rx="34"/></clipPath>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>

 <linearGradient id="facetLineFade" x1="425" y1="0" x2="590" y2="0" gradientUnits="userSpaceOnUse">
   <stop stop-color="#fff"/>
   <stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
 <mask id="facetLineMask" x="0" y="0" width="856" height="540" maskUnits="userSpaceOnUse">
   <rect width="856" height="540" fill="url(#facetLineFade)"/>
 </mask>
 <linearGradient id="crystalSheen" x1="552" y1="8" x2="848" y2="112" gradientUnits="userSpaceOnUse">
   <stop stop-color="#9B85E2" stop-opacity=".12"/>
   <stop offset=".55" stop-color="#8395DD" stop-opacity=".2"/>
   <stop offset="1" stop-color="#77C2E3" stop-opacity=".23"/>
 </linearGradient>
 <radialGradient id="emblemLight" cx="687" cy="247" r="200" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 17.29) scale(1 .93)">
   <stop stop-color="#555991" stop-opacity=".23"/>
   <stop offset=".62" stop-color="#555991" stop-opacity=".10"/>
   <stop offset="1" stop-color="#555991" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="emblemStroke" x1="8%" y1="8%" x2="92%" y2="93%">
   <stop stop-color="#E1E2F9"/>
   <stop offset=".33" stop-color="#B5B4E2"/>
   <stop offset=".65" stop-color="#8F9ACB"/>
   <stop offset="1" stop-color="#C4DFED"/>
 </linearGradient>

</defs>
<rect x="8" y="14" width="840" height="524" rx="36" fill="#000" opacity=".55" filter="url(#shadow)"/>
<g clip-path="url(#clip)">
 <rect x="8" y="8" width="840" height="524" rx="34" fill="url(#violet)"/>
 <!-- faceted low-poly fan / abstract feathering -->
 <path d="M8 8H470L328 142 180 178 8 112Z" fill="#6D5BAA" opacity=".25"/>
 <path d="M8 112 180 178 256 282 8 320Z" fill="#4C4E9C" opacity=".34"/>
 <path d="M8 320 256 282 328 420 8 532Z" fill="#293B75" opacity=".48"/>
 <path d="M180 178 470 8 425 205 256 282Z" fill="#8C6EC7" opacity=".28"/>
 <path d="M256 282 425 205 520 350 328 420Z" fill="#5458A9" opacity=".34"/>
 <path d="M328 420 520 350 600 532H8Z" fill="#283D70" opacity=".36"/>
 <path d="M470 8H848V532H600L520 350 425 205Z" fill="#080D20" opacity=".48"/>
 <g fill="none" stroke="url(#shine)" stroke-opacity=".3" stroke-width="1.2">
  <path d="M470 8 425 205 520 350 600 532M8 320 256 282 328 420"/>
  <path d="M180 178 425 205 848 8M256 282 520 350 848 532" mask="url(#facetLineMask)"/>
 </g>
 <!-- micro facets -->
 <g fill="none" stroke="#D5D2FF" stroke-opacity=".14" stroke-width="1">
  <path d="M8 8 180 178 256 282 328 420M8 112 180 178 425 205M8 320 256 282 520 350M180 178 470 8M256 282 425 205 520 350"/>
 </g>
 <!-- fine satin texture -->
 <path d="M0 480C190 390 350 400 540 520" fill="none" stroke="#8C8AF0" stroke-opacity=".12" stroke-width="30"/>

 <!-- Flush-mounted EMV contact module: engraved into the card, not floating above it -->
 <g id="emv-chip" transform="translate(82 207)">
   <defs>
     <linearGradient id="chipBase" x1="0" y1="0" x2="112" y2="82" gradientUnits="userSpaceOnUse">
       <stop stop-color="#B9B2C8"/>
       <stop offset=".22" stop-color="#777287"/>
       <stop offset=".52" stop-color="#AAA4B7"/>
       <stop offset=".78" stop-color="#625E77"/>
       <stop offset="1" stop-color="#C4BDCE"/>
     </linearGradient>
     <linearGradient id="chipFace" x1="5" y1="4" x2="106" y2="76" gradientUnits="userSpaceOnUse">
       <stop stop-color="#BDB8C9"/>
       <stop offset=".3" stop-color="#898397"/>
       <stop offset=".62" stop-color="#A9A3B6"/>
       <stop offset="1" stop-color="#716C82"/>
     </linearGradient>
     <linearGradient id="chipSheen" x1="0" y1="0" x2="0" y2="82" gradientUnits="userSpaceOnUse">
       <stop stop-color="#FFFFFF" stop-opacity=".48"/>
       <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".08"/>
       <stop offset=".78" stop-color="#1A1730" stop-opacity=".10"/>
       <stop offset="1" stop-color="#17132B" stop-opacity=".32"/>
     </linearGradient>
     <pattern id="chipBrush" width="4" height="4" patternUnits="userSpaceOnUse">
       <path d="M0 .5H4" stroke="#F2EDF8" stroke-opacity=".20" stroke-width=".45"/>
       <path d="M0 2.5H4" stroke="#39334F" stroke-opacity=".12" stroke-width=".35"/>
     </pattern>
     <clipPath id="chipClip"><rect x="0" y="0" width="112" height="82" rx="14"/></clipPath>
   </defs>
   <!-- recessed socket and fine perimeter reveal -->
   <rect x="-2" y="-2" width="116" height="86" rx="16" fill="#111126" opacity=".72"/>
   <rect x="0" y="0" width="112" height="82" rx="14" fill="url(#chipBase)" stroke="#C5BED1" stroke-opacity=".65" stroke-width="1"/>
   <g clip-path="url(#chipClip)">
     <rect x="3" y="3" width="106" height="76" rx="11" fill="url(#chipFace)"/>
     <rect x="3" y="3" width="106" height="76" fill="url(#chipBrush)" opacity=".8"/>
     <!-- contact-pad geometry, with dark recessed channels and fine metallic inner lips -->
     <g fill="none" stroke-linejoin="round">
       <path d="M43 3V18Q43 23 36 23H3M69 3V18Q69 23 76 23H109" stroke="#373149" stroke-width="3.2"/>
       <path d="M43 3V18Q43 23 36 23H3M69 3V18Q69 23 76 23H109" stroke="#E1DCE9" stroke-opacity=".66" stroke-width=".8"/>
       <path d="M3 40H29Q35 40 35 46V36Q35 30 42 30H70Q77 30 77 36V46Q77 40 83 40H109" stroke="#39334C" stroke-width="3"/>
       <path d="M3 40H29Q35 40 35 46V36Q35 30 42 30H70Q77 30 77 36V46Q77 40 83 40H109" stroke="#DCD6E4" stroke-opacity=".6" stroke-width=".75"/>
       <path d="M3 62H36Q43 62 43 69V79M109 62H76Q69 62 69 69V79" stroke="#39334C" stroke-width="3"/>
       <path d="M3 62H36Q43 62 43 69V79M109 62H76Q69 62 69 69V79" stroke="#E4DFEA" stroke-opacity=".58" stroke-width=".75"/>
       <path d="M35 46Q35 39 42 39H70Q77 39 77 46V59Q77 66 70 66H42Q35 66 35 59Z" fill="#AAA4B6" stroke="#3D374F" stroke-width="2.6"/>
       <path d="M37 46Q37 41 43 41H69Q75 41 75 46V58Q75 64 69 64H43Q37 64 37 58Z" stroke="#EAE5EF" stroke-opacity=".58" stroke-width=".8"/>
     </g>
     <!-- subtle reflected violet from the card surface -->
     <path d="M0 0H112V13C83 22 39 18 0 32Z" fill="#E6DFFF" opacity=".13"/>
     <rect x="3" y="3" width="106" height="76" fill="url(#chipSheen)"/>
   </g>
   <rect x="1" y="1" width="110" height="80" rx="13" fill="none" stroke="#E9E4F0" stroke-opacity=".48" stroke-width=".8"/>
 </g>


 <!-- Three facets cut into the top-right edge -->
 <g id="right-crystal" fill="url(#crystalSheen)">
   <path d="M552 8H709L674 47Z" opacity=".74"/>
   <path d="M709 8H798L771 72L674 47Z"/>
   <path d="M798 8H848V116L771 72Z" opacity=".85"/>
   <path d="M552 8L674 47L771 72L848 116M709 8L674 47M798 8L771 72"
         fill="none" stroke="#B6BCE6" stroke-opacity=".19" stroke-width="1"/>
 </g>

 <!-- Threefold emblem on the satin field -->
 <rect x="480" y="50" width="368" height="392" fill="url(#emblemLight)"/>
 <g id="user-threefold-emblem" transform="translate(572 123) scale(.083)">
   <path d="M1563.56,281.86 A576.72,576.72 0 1 1 973.50,1010.13 A757.50,757.50 0 0 0 388.09,2200.00 A576.72,576.72 0 1 1 1313.91,2347.16 A757.50,757.50 0 0 0 2637.24,2258.90 A576.72,576.72 0 1 1 2301.66,1383.77 A757.50,757.50 0 0 0 1563.72,281.85 Z"
         fill="url(#emblemStroke)" fill-opacity=".095"
         stroke="url(#emblemStroke)" stroke-opacity=".92" stroke-width="20"
         stroke-linejoin="round"/>
 </g>

 <!-- Oversized low-opacity monogram watermark -->
 <text x="38" y="516" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="188" font-weight="800" letter-spacing="-14" fill="#AEBBFF" opacity=".075">NX</text>
 <!-- Card identity -->
 <g id="card-identity" font-family="Inter,Segoe UI,Arial,sans-serif">
   <text x="42" y="57" font-size="20" font-weight="700" letter-spacing="4.2" fill="#E7EAFB">NEXUSNODE</text>
   <text x="44" y="82" font-size="11.5" font-weight="550" letter-spacing="2.2" fill="#B6BEDB" opacity=".92">ZERO-PANEL PROXY ENGINE</text>
   <!-- contactless symbol, deliberately small and understated -->
   <g transform="translate(213 229)" fill="none" stroke="#DCE5FF" stroke-width="2.1" stroke-linecap="round" opacity=".78">
     <path d="M0 0Q12 11 0 22"/>
     <path d="M6 -5Q23 11 6 27"/>
     <path d="M12 -10Q34 11 12 32"/>
   </g>
   <!-- central brand statement: project identity, not payment-card data -->
   <text x="42" y="365" font-size="27" font-weight="750" letter-spacing="2.8" fill="#E1E6FF" opacity=".96">ONE NEXUS. MANY ROUTES.</text>
   <text x="44" y="393" font-size="11.5" font-weight="650" letter-spacing="2.4" fill="#AEB9E0" opacity=".88">MULTI-PROTOCOL DEPLOYMENT ENGINE</text>
   <text x="44" y="465" font-size="10.5" font-weight="650" letter-spacing="2.0" fill="#AAB3D2" opacity=".82">PROJECT</text>
   <text x="44" y="493" font-size="17" font-weight="700" letter-spacing="1.3" fill="#E3E8FF">NEXUS NODE</text>
   <text x="684" y="465" font-size="10.5" font-weight="650" letter-spacing="2.0" fill="#AAB3D2" opacity=".82">PROJECT TYPE</text>
   <text x="684" y="493" font-size="16" font-weight="700" letter-spacing="1.0" fill="#E3E8FF">PROXY ENGINE</text>
 </g>

</g>
<rect x="8.8" y="8.8" width="838.4" height="522.4" rx="33.5" fill="none" stroke="#AFA8D5" stroke-opacity=".55" stroke-width="1.6"/>
<rect x="17" y="17" width="822" height="506" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
</svg>