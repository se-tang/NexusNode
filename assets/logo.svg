<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 132" width="500" height="132" fill="none">
  <defs>
    <!-- Background & Surface -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="500" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="68" cy="66" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="445" cy="24" r="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="ringGrad1" x1="20" y1="22" x2="116" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="116" y1="22" x2="20" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hexFaceTop" x1="68" y1="36" x2="68" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hexFaceLeft" x1="42" y1="51" x2="68" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="hexFaceRight" x1="68" y1="51" x2="94" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="140" y1="40" x2="430" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="1.5" y="1.5" width="497" height="129" rx="22" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="2" y="2" width="496" height="128" rx="21.5" fill="url(#ambientGlow)"/>
  <rect x="2" y="2" width="496" height="128" rx="21.5" fill="url(#rightGlow)"/>

  <!-- Subtle Tech Grid Lines -->
  <path d="M142 0V132M456 0V132" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Emblem Group (Center at 68, 66) -->
  <!-- Outer Dashed Radar Ring -->
  <circle cx="68" cy="66" r="46" stroke="#334155" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Outer Hexagon Frame -->
  <polygon points="68,24 104.4,45 104.4,87 68,108 31.6,87 31.6,45" stroke="url(#ringGrad1)" stroke-width="1.5" stroke-opacity="0.65" fill="#0B1120" fill-opacity="0.7"/>

  <!-- Tilted Orbital Rings -->
  <ellipse cx="68" cy="66" rx="44" ry="17" transform="rotate(-28 68 66)" stroke="url(#ringGrad1)" stroke-width="1.75" filter="url(#softGlow)"/>
  <ellipse cx="68" cy="66" rx="44" ry="17" transform="rotate(28 68 66)" stroke="url(#ringGrad2)" stroke-width="1.5"/>

  <!-- Isometric 3D Nexus Core -->
  <!-- Top Face -->
  <polygon points="68,42 88.8,54 68,66 47.2,54" fill="url(#hexFaceTop)" fill-opacity="0.92"/>
  <!-- Left Face -->
  <polygon points="47.2,54 68,66 68,90 47.2,78" fill="url(#hexFaceLeft)" fill-opacity="0.95"/>
  <!-- Right Face -->
  <polygon points="88.8,54 68,66 68,90 88.8,78" fill="url(#hexFaceRight)" fill-opacity="0.95"/>
  <!-- Core Wireframe Highlight -->
  <path d="M68 42L88.8 54V78L68 90L47.2 78V54L68 42ZM68 66V90M47.2 54L68 66L88.8 54" stroke="#E0F2FE" stroke-width="0.9" stroke-opacity="0.7"/>

  <!-- Central Energy Diamond -->
  <polygon points="68,58 74,66 68,74 62,66" fill="#F0F9FF" filter="url(#softGlow)"/>

  <!-- Satellite Routing Nodes -->
  <circle cx="68" cy="24" r="3.5" fill="#38BDF8" filter="url(#softGlow)"/>
  <circle cx="104.4" cy="45" r="3" fill="#818CF8"/>
  <circle cx="104.4" cy="87" r="3.5" fill="#C084FC" filter="url(#softGlow)"/>
  <circle cx="68" cy="108" r="3" fill="#38BDF8"/>
  <circle cx="31.6" cy="87" r="3" fill="#6366F1"/>
  <circle cx="31.6" cy="45" r="3.5" fill="#22D3EE" filter="url(#softGlow)"/>

  <!-- Brand Typography -->
  <text x="158" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.6" fill="url(#wordGrad)">Nexus<tspan fill="#38BDF8">Node</tspan></text>

  <!-- Subtitle Pill & Tagline -->
  <rect x="160" y="80" width="94" height="20" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="171" cy="90" r="3" fill="#22D3EE"/>
  <text x="179" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#E2E8F0">ZERO-PANEL</text>
  <text x="266" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.8" fill="#94A3B8">XRAY · SING-BOX ENGINE</text>
</svg>
