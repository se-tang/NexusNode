<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="540" height="220" fill="none" role="img" aria-labelledby="title">
  <title id="title">NexusNode — Zero-Panel Proxy Engine</title>
  <defs>
    <!-- Matte Obsidian Metal Card Base -->
    <linearGradient id="cardBase" x1="0" y1="0" x2="540" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B101B"/>
    </linearGradient>

    <!-- Diagonal Metallic Specular Sheen -->
    <linearGradient id="metalSheen" x1="60" y1="0" x2="440" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="68%" stop-color="#6366F1" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Rim Bevel Stroke -->
    <linearGradient id="rimStroke" x1="0" y1="0" x2="540" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Subtle Ambient Aura -->
    <radialGradient id="aura" cx="440" cy="40" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <!-- Emblem Dual-Tone Metallic/Cyan Gradients -->
    <linearGradient id="wingTop" x1="28" y1="24" x2="104" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="wingBot" x1="40" y1="48" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="56" y1="54" x2="80" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- EMV Chip Metallic Gradient -->
    <linearGradient id="chipGrad" x1="36" y1="126" x2="84" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="536" height="216" rx="18"/>
    </clipPath>
  </defs>

  <!-- Card Outer Shadow & Base -->
  <rect x="2" y="2" width="536" height="216" rx="18" fill="url(#cardBase)"/>
  <rect x="2" y="2" width="536" height="216" rx="18" fill="url(#aura)"/>

  <!-- Subtle Security Wave / Guilloche Pattern inside Card -->
  <g clip-path="url(#cardClip)" opacity="0.07" stroke="#94A3B8" stroke-width="0.9">
    <path d="M-20 175 Q 140 120, 290 170 T 570 155"/>
    <path d="M-20 185 Q 140 130, 290 180 T 570 165"/>
    <path d="M-20 195 Q 140 140, 290 190 T 570 175"/>
    <path d="M-20 205 Q 140 150, 290 200 T 570 185"/>
  </g>

  <!-- Diagonal Metallic Sheen Overlay -->
  <rect x="2" y="2" width="536" height="216" rx="18" fill="url(#metalSheen)"/>

  <!-- Inner Hairline & Outer Bevel Rim -->
  <rect x="2" y="2" width="536" height="216" rx="18" stroke="url(#rimStroke)" stroke-width="1.5"/>
  <rect x="10" y="10" width="520" height="200" rx="13" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Folded Ribbon Emblem (Scaled to 76x76 at x=34, y=28) -->
  <g transform="translate(34, 26) scale(0.31)">
    <!-- Top-Left Folded Wing -->
    <polygon points="128,20 221.5,74 186.9,94 128,60 69.1,94 69.1,162 34.5,202 34.5,74" fill="url(#wingTop)"/>
    <!-- Bottom-Right Folded Wing -->
    <polygon points="128,236 34.5,182 69.1,162 128,196 186.9,162 186.9,94 221.5,54 221.5,182" fill="url(#wingBot)"/>
    <!-- Central Hexagonal Core -->
    <polygon points="128,96 155.7,112 155.7,144 128,160 100.3,144 100.3,112" fill="url(#coreGrad)"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="126" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">Nexus<tspan fill="#38BDF8">Node</tspan></text>
  <text x="127" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#94A3B8">ZERO-PANEL PROXY ENGINE</text>

  <!-- Top-Right Contactless / Signal Icon & Tier Pill -->
  <g transform="translate(466, 36)" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <path d="M4 16 A12 12 0 0 1 4 4" fill="none"/>
    <path d="M10 19 A18 18 0 0 1 10 1" fill="none"/>
    <path d="M16 22 A24 24 0 0 1 16 -2" fill="none"/>
  </g>
  <rect x="372" y="34" width="80" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="384" cy="45" r="3" fill="#22D3EE"/>
  <text x="392" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1" fill="#E2E8F0">CLI · nx</text>

  <!-- Bank Card EMV Secure Chip (Bottom-Left) -->
  <g transform="translate(36, 134)">
    <rect x="0" y="0" width="46" height="34" rx="6" fill="url(#chipGrad)" fill-opacity="0.85" stroke="#E2E8F0" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="15" y1="0" x2="15" y2="34" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="31" y1="0" x2="31" y2="34" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="0" y1="11" x2="15" y2="11" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="0" y1="23" x2="15" y2="23" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="31" y1="11" x2="46" y2="11" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="31" y1="23" x2="46" y2="23" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
    <rect x="15" y="10" width="16" height="14" rx="2" fill="none" stroke="#0F172A" stroke-opacity="0.45" stroke-width="1.1"/>
  </g>

  <!-- Card Embossed-Style Protocol & Core Metadata (Bottom) -->
  <text x="98" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6" fill="#CBD5E1">XRAY-CORE  ·  SING-BOX</text>
  <text x="98" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#64748B">REALITY · HY2 · TUIC · SS2022</text>

  <!-- Bottom-Right Network Stamp -->
  <text x="504" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="2" fill="#475569">TLS 1.3 // H2</text>
  <text x="36" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="2.4" fill="#64748B">SE-TANG / NEXUSNODE</text>
</svg>
